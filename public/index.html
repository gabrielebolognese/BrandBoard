<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlashBrand</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preload" as="image" href="/board.webp" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="mark"></span>FlashBrand</div>
      <div class="watching">
        <span class="dot"></span><span id="stat-watching">0</span> currently watching
      </div>
      <div class="counts">
        <span id="stat-available">0</span> free space
        <span class="sep"></span>
        <span id="stat-live">0</span> planets
      </div>
      <button type="button" class="dir-toggle" id="dir-toggle" aria-expanded="false"
              aria-controls="directory">Browse</button>
      <div class="auth" id="auth"></div>
      <div class="dev">
        <button type="button" data-action="showcase" title="Wipe and fill the board with a demonstration set">Fill board</button>
        <button type="button" data-action="sweep">Sweep</button>
        <button type="button" data-action="reset">Reset</button>
      </div>
    </header>

    <main class="layout">
      <aside class="featured">
        <div class="featured-list" id="featured-list"></div>
        <button type="button" class="featured-buy" id="featured-buy">Feature a planet</button>
      </aside>

      <div class="viewport" id="viewport">
        <canvas id="board"></canvas>
      </div>
    </main>

    <aside class="directory" id="directory" hidden aria-label="Browse the universe">
      <div class="dir-head">
        <input type="search" data-role="search" class="dir-search"
               placeholder="Search planets" aria-label="Search planets" />
        <button type="button" data-role="close" class="dir-close" aria-label="Close">&times;</button>
      </div>
      <div class="dir-scarcity" data-role="scarcity"></div>
      <div class="dir-chips" data-role="chips"></div>
      <p class="dir-count" data-role="count"></p>
      <div class="dir-results" data-role="results"></div>
    </aside>

    <div class="badge" id="badge" hidden></div>


    <div class="card" id="card" hidden>
      <div class="card-avatar" id="card-avatar"></div>
      <div class="card-body">
        <p class="card-name" id="card-name"></p>
        <p class="card-handle" id="card-handle"></p>
        <div class="card-links" id="card-links"></div>
        <p class="card-warning" id="card-warning" hidden></p>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
